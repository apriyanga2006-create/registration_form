<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{

      height:100vh;

      display:flex;

      justify-content:center;

      align-items:center;

      background:#0f172a;

      overflow:hidden;

      position:relative;
    }

    .background{

      position:absolute;

      width:100%;
      height:100%;

      background:
      linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
      );

      filter:blur(120px);

      opacity:0.7;
    }

    .login-box{

      position:relative;

      width:380px;

      padding:35px;

      border-radius:24px;

      background:rgba(255,255,255,0.08);

      backdrop-filter:blur(20px);

      border:1px solid rgba(255,255,255,0.15);

      box-shadow:
      0 10px 40px rgba(0,0,0,0.3);

      color:white;
    }

    h2{
      margin-bottom:20px;
      text-align:center;
    }

    input{

      width:100%;

      padding:14px;

      margin-top:14px;

      border:none;

      border-radius:14px;

      outline:none;

      background:rgba(255,255,255,0.12);

      color:white;
    }

    input::placeholder{
      color:#ddd;
    }

    button{

      width:100%;

      padding:14px;

      margin-top:20px;

      border:none;

      border-radius:14px;

      cursor:pointer;

      font-weight:bold;

      background:white;

      color:#111827;

      transition:0.3s;
    }

    button:hover{
      transform:scale(1.03);
    }

  </style>

</head>

<body>

<div class="background"></div>

<div class="login-box">

  <h2>Login</h2>

  <form action="login.php" method="POST">

    <input
      type="text"
      name="username"
      placeholder="Username"
      required
    >

    <input
      type="password"
      name="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      Login
    </button>

  </form>

</div>

</body>

</html>
